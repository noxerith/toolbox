<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>미니 도구 상자</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg: #09090a;
            --sf: #101012;
            --tx: #fafafa;
            --mu: #9a9aa4;
            --ln: #202024;
            --tg: #1c1c20;
            --ac: #f97316;
            --ai: #fff;
            --a2: #fb923c;
            --as: #2a190d;
            --al: #3b2412;
            --ta: #fcd34d;
            --tb: #f59e0b;
            --ok: #4cc276;
            --er: #ff7b72;
            box-sizing: border-box;
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
        }

        :root[data-theme=light] {
            color-scheme: light;
            --bg: #fafafa;
            --sf: #fff;
            --tx: #18181b;
            --mu: #6b6b76;
            --ln: #e4e4e7;
            --tg: #f1f1f3;
            --ac: #ea580c;
            --a2: #c2410c;
            --as: #ffedd5;
            --al: #fdba74;
            --ta: #d97706;
            --tb: #ea580c;
            --ok: #157f3b;
            --er: #c5221f;
        }

        html {
            background: var(--bg);
            -webkit-text-size-adjust: 100%;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 16px/1.55 'Inter', 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        .mono,
        .out {
            font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        :focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px;
        }

        .nav {
            border-bottom: 1px solid var(--ln);
        }

        .nav-in {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 76px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand {
            appearance: none;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            margin-right: auto;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -.01em;
            min-height: 44px;
        }

        .logo {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, #fb923c, #ea580c);
        }

        .logo svg {
            width: 20px;
            height: 20px;
        }

        .ns {
            flex: 1 1 auto;
            max-width: 300px;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            border: 1px solid var(--ln);
            border-radius: 12px;
            background: var(--sf);
            color: var(--mu);
        }

        .ns:focus-within {
            outline: 2px solid var(--ac);
            outline-offset: 2px;
        }

        .ns input {
            flex: 1;
            min-width: 0;
            border: 0;
            background: transparent;
            outline: none;
            font-size: 16px;
            color: var(--tx);
        }

        .ns input::placeholder {
            color: var(--mu);
        }

        kbd {
            font: 500 12px/1 'Inter', system-ui, sans-serif;
            background: var(--tg);
            color: var(--mu);
            border-radius: 6px;
            padding: 4px 7px;
        }

        .nl {
            appearance: none;
            background: none;
            border: 0;
            cursor: pointer;
            color: var(--mu);
            padding: 0 10px;
            min-height: 44px;
            font-weight: 500;
        }

        .ib {
            flex: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 0;
            background: transparent;
            color: var(--mu);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .nl:hover,
        .ib:hover,
        .back:hover,
        .chip:hover {
            color: var(--tx);
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 56px;
        }

        .hero {
            text-align: center;
            padding: clamp(40px, 9vw, 72px) 0 0;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(38px, 9vw, 64px);
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: 1.1;
        }

        .grad {
            background: linear-gradient(90deg, var(--ta), var(--tb));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .count {
            margin: 18px 0 0;
            color: var(--mu);
            font-size: clamp(16px, 3.6vw, 20px);
        }

        .chips {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 6px 2px 8px;
            margin: clamp(28px, 6vw, 44px) 0 24px;
            scrollbar-width: none;
        }

        .chips::-webkit-scrollbar {
            display: none;
        }

        .chip:first-child {
            margin-left: auto;
        }

        .chip:last-child {
            margin-right: auto;
        }

        .chip {
            flex: none;
            height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid var(--ln);
            background: var(--sf);
            color: var(--mu);
            font-weight: 500;
        }

        .chip[aria-pressed=true] {
            background: var(--ac);
            border-color: var(--ac);
            color: var(--ai);
            font-weight: 700;
            box-shadow: 0 6px 20px -8px var(--ac);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            position: relative;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 24px;
        }

        .card:hover {
            border-color: var(--al);
        }

        .open {
            appearance: none;
            background: none;
            border: 0;
            display: block;
            width: 100%;
            height: 100%;
            text-align: left;
            padding: 24px;
            border-radius: 24px;
            cursor: pointer;
            min-height: 200px;
        }

        .icon {
            width: 54px;
            height: 54px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            background: var(--as);
            border: 1px solid var(--al);
            color: var(--a2);
        }

        .icon svg {
            width: 26px;
            height: 26px;
        }

        .nr {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 22px;
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.015em;
            line-height: 1.3;
        }

        .tag {
            flex: none;
            font-size: 12px;
            color: var(--mu);
            background: var(--tg);
            border-radius: 999px;
            padding: 3px 11px;
        }

        .desc {
            margin: 8px 0 0;
            color: var(--mu);
        }

        .go {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 18px;
            color: var(--a2);
            font-weight: 500;
        }

        .go svg {
            width: 17px;
            height: 17px;
        }

        .star {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 0;
            background: transparent;
            color: var(--mu);
            cursor: pointer;
            display: grid;
            place-items: center;
        }

        .star[aria-pressed=true] {
            color: var(--ac);
        }

        .empty {
            color: var(--mu);
            padding: 36px 4px;
            text-align: center;
        }

        #tool {
            max-width: 760px;
            margin: 0 auto;
        }

        .back {
            appearance: none;
            background: none;
            border: 0;
            cursor: pointer;
            color: var(--mu);
            padding: 10px 0;
            margin: 28px 0 0;
            font-weight: 500;
            min-height: 44px;
        }

        .th h1 {
            margin: 4px 0 0;
            font-size: clamp(28px, 6vw, 38px);
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.2;
        }

        .th p {
            margin: 8px 0 22px;
            color: var(--mu);
        }

        .panel {
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 24px;
            padding: 20px;
        }

        .fs {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 12px;
        }

        .fld {
            grid-column: 1 / -1;
            margin-bottom: 14px;
        }

        .fld.h {
            grid-column: auto;
        }

        .lbl {
            display: block;
            font-weight: 700;
            font-size: 14px;
            margin: 0 0 8px;
        }

        .rl {
            margin: 6px 0 8px;
        }

        textarea,
        input[type=text],
        input[type=number],
        input[type=date],
        select {
            width: 100%;
            border: 1px solid var(--ln);
            background: var(--bg);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 16px;
        }

        input[type=number],
        input[type=date],
        select {
            height: 50px;
            padding-top: 0;
            padding-bottom: 0;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--ac);
            height: 36px;
        }

        input[type=color] {
            width: 54px;
            height: 50px;
            padding: 3px;
            border: 1px solid var(--ln);
            border-radius: 12px;
            background: var(--bg);
            flex: none;
        }

        input[type=checkbox] {
            width: 20px;
            height: 20px;
            accent-color: var(--ac);
        }

        .check {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            cursor: pointer;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 2px 0 4px;
        }

        .btn {
            height: 48px;
            padding: 0 18px;
            border-radius: 12px;
            border: 1px solid var(--ln);
            background: var(--sf);
            cursor: pointer;
            font-weight: 700;
        }

        .btn.primary {
            background: var(--ac);
            border-color: var(--ac);
            color: var(--ai);
        }

        .btn.small {
            height: 40px;
            padding: 0 14px;
            font-weight: 500;
        }

        .status {
            min-height: 24px;
            margin: 8px 0 0;
            font-size: 14px;
            color: var(--mu);
        }

        .status.ok {
            color: var(--ok);
        }

        .status.err {
            color: var(--er);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .stat {
            border: 1px solid var(--ln);
            border-radius: 16px;
            padding: 12px 14px;
            background: var(--bg);
        }

        .stat .k {
            color: var(--mu);
            font-size: 13px;
        }

        .stat .v {
            font-size: 21px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.01em;
            word-break: break-all;
        }

        .color-in {
            display: flex;
            gap: 10px;
        }

        .swatch {
            height: 84px;
            border-radius: 16px;
            border: 1px solid var(--ln);
            margin: 12px 0;
        }

        .val-row {
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--ln);
            border-radius: 16px;
            padding: 8px 8px 8px 14px;
            background: var(--bg);
            margin-top: 8px;
        }

        .val-row .k {
            width: 42px;
            flex: none;
            color: var(--mu);
            font-size: 13px;
            font-weight: 700;
        }

        .val-row .v {
            flex: 1;
            min-width: 0;
            word-break: break-all;
        }

        footer {
            margin-top: 40px;
            color: var(--mu);
            font-size: 13px;
            text-align: center;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--tx);
            color: var(--bg);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 640px) {
            .nl,
            kbd {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .brand span:last-child {
                display: none;
            }

            .nav-in {
                padding: 0 14px;
            }

            .wrap {
                padding: 0 14px 48px;
            }
        }

        @media (hover: none) {
            kbd {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>

    <script>
        var t;

        try {
            t = localStorage.getItem('toolbox:theme');
        } catch (e) {}

        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    </script>
</head>
<body>
    <header class="nav">
        <div class="nav-in">
            <button class="brand" id="brand" type="button" aria-label="처음으로">
                <span class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="2" />
                        <rect x="14" y="3" width="7" height="7" rx="2" />
                        <rect x="3" y="14" width="7" height="7" rx="2" />
                        <rect x="14" y="14" width="7" height="7" rx="2" />
                    </svg>
                </span>
                <span>미니 도구 상자</span>
            </button>

            <label class="ns">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" />
                    <path d="M20 20l-3.5-3.5" />
                </svg>
                <input id="q" type="search" placeholder="검색..." autocomplete="off" aria-label="도구 검색">
                <kbd aria-hidden="true">⌘K</kbd>
            </label>

            <button class="nl" id="navTools" type="button">도구</button>
            <button class="ib" id="theme" type="button" aria-label="밝은 화면과 어두운 화면 바꾸기">
                <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <circle cx="12" cy="12" r="8.5" />
                    <path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" />
                </svg>
            </button>
        </div>
    </header>

    <div class="wrap">
        <main>
            <section id="home">
                <div class="hero">
                    <h1><span class="grad">인기</span> 도구</h1>
                    <p class="count" id="count" aria-live="polite"></p>
                </div>
                <div class="chips" id="chips" role="group" aria-label="카테고리"></div>
                <div class="grid" id="grid"></div>
            </section>

            <section id="tool" hidden>
                <button class="back" id="back" type="button">‹ 모든 도구</button>
                <div class="th">
                    <h1 id="tt"></h1>
                    <p id="td"></p>
                </div>
                <div class="panel" id="tb"></div>
            </section>
        </main>

        <footer>입력한 내용은 이 브라우저 안에서만 처리되고 어디로도 전송되지 않아요.</footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        (function () {
            'use strict';

            const $ = (s, r = document) => r.querySelector(s);
            const $$ = (s, r = document) => [...r.querySelectorAll(s)];
            const esc = s => String(s).replace(/[&<>"]/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;'
            }[c]));
            const fmt = n => Number.isFinite(n)
                ? (+n.toPrecision(12)).toLocaleString('ko-KR', { maximumFractionDigits: 10 })
                : '-';
            const ls = (k, v) => {
                try {
                    return v === undefined
                        ? localStorage.getItem(k)
                        : localStorage.setItem(k, v);
                } catch (e) {
                    return null;
                }
            };

            let tt;

            const toast = m => {
                const t = $('#toast');
                t.textContent = m;
                t.classList.add('show');
                clearTimeout(tt);
                tt = setTimeout(() => t.classList.remove('show'), 1400);
            };

            async function copy(x) {
                if (!x) {
                    toast('복사할 내용이 없어요');
                    return;
                }

                let ok = false;

                try {
                    await navigator.clipboard.writeText(x);
                    ok = true;
                } catch (e) {
                    try {
                        const a = document.createElement('textarea');
                        a.value = x;
                        a.style.cssText = 'position:fixed;opacity:0';
                        document.body.appendChild(a);
                        a.select();
                        ok = document.execCommand('copy');
                        a.remove();
                    } catch (e2) {}
                }

                toast(ok ? '복사했어요' : '복사하지 못했어요. 직접 선택해 복사해 주세요.');
            }

            const st = (el, m, k) => {
                el.textContent = m || '';
                el.className = 'status' + (k ? ' ' + k : '');
            };

            const bindCopy = root => root.addEventListener('click', e => {
                const b = e.target.closest('[data-c],[data-copy]');
                if (b) {
                    copy(b.hasAttribute('data-c') ? b.dataset.c : ($('#o', root) || {}).value);
                }
            });

            const view = r =>
                (r.out != null
                    ? `<div class="lbl rl">결과</div><textarea id="o" class="out" readonly rows="${r.n || 5}" spellcheck="false"></textarea><div class="actions"><button class="btn" data-copy type="button">결과 복사</button></div>`
                    : '')
                + (r.list
                    ? r.list.map(([k, v]) => `<div class="val-row"><span class="k">${esc(k)}</span><span class="v mono">${esc(v)}</span><button class="btn small" data-c="${esc(v)}" type="button" aria-label="${esc(k)} 복사">복사</button></div>`).join('')
                    : '')
                + (r.stats
                    ? '<div class="stats">' + r.stats.map(([k, v]) => `<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join('') + '</div>'
                    : '');

            /* ---- 공통 폼 엔진: fields(입력) + run(값) → {out,list,stats,err,ok,note} ---- */
            function form(root, T) {
                const F = T.fields || [];

                root.innerHTML = '<div class="fs">' + F.map(f => {
                    const id = 'f_' + f.id;
                    const t = f.t || 'number';
                    let h;

                    if (t === 'chk') {
                        return `<div class="fld${f.h ? ' h' : ''}" data-f="${f.id}"><label class="check"><input type="checkbox" id="${id}"${f.v ? ' checked' : ''}> ${f.label}</label></div>`;
                    }

                    if (t === 'area') {
                        h = `<textarea id="${id}" rows="${f.rows || 6}" spellcheck="false" placeholder="${esc(f.ph || '')}"></textarea>`;
                    } else if (t === 'sel') {
                        h = `<select id="${id}">` + (f.og
                            ? Object.entries(f.og).map(([g, a]) => `<optgroup label="${g}">` + a.map(u => `<option value="${g}|${u}"${u === f.v ? ' selected' : ''}>${u}</option>`).join('') + '</optgroup>').join('')
                            : f.o.map((o, i) => `<option value="${i}">${o}</option>`).join('')) + '</select>';
                    } else {
                        h = `<input id="${id}" type="${t}"${t === 'number' ? ' step="any"' : ''}${t === 'range' ? ` min="${f.min}" max="${f.max}"` : ''} value="${f.v ?? ''}">`;
                    }

                    return `<div class="fld${f.h ? ' h' : ''}" data-f="${f.id}"><label class="lbl" for="${id}">${f.label}${t === 'range' ? ' <b class="rv"></b>' : ''}</label>${h}</div>`;
                }).join('')
                    + '</div><div class="actions">'
                    + (T.btn ? `<button class="btn primary" id="rg" type="button">${T.btn}</button>` : '')
                    + (F.some(f => f.t === 'area') ? '<button class="btn" id="clr" type="button">모두 지우기</button>' : '')
                    + '</div><div class="status" id="st" aria-live="polite"></div><div id="res"></div>';

                const res = $('#res', root);
                const s = $('#st', root);

                const val = () => {
                    const v = {};

                    F.forEach(f => {
                        const e = $('#f_' + f.id, root);
                        const t = f.t || 'number';

                        v[f.id] = t === 'chk'
                            ? e.checked
                            : t === 'sel'
                                ? (f.og ? e.value : e.selectedIndex)
                                : (t === 'number' || t === 'range')
                                    ? (e.value === '' ? NaN : +e.value)
                                    : e.value;
                    });

                    return v;
                };

                            note: sw ? '날짜 1이 더 늦어서 순서를 바꿔 계산했어요.' : '',
                            stats: [
                                ['총 일수', fmt(d) + '일'],
                                ['주 단위', Math.floor(d / 7) + '주 ' + d % 7 + '일'],
                                ['년·개월·일', `${Y}년 ${M}개월 ${D}일`]
                            ]
                        };
                    }
                },
                {
                    id: 'dday',
                    name: 'D-Day',
                    cat: '계산',
                    icon: ic('<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'),
                    keys: 'dday d-day countdown anniversary 디데이 기념일 100일',
                    desc: '목표일까지 남은 날이나 기념일(100일 등)을 계산해요.',
                    fields: [
                        { id: 't', t: 'date', h: 1, label: '목표일 / 시작일', v: TD },
                        { id: 'b', t: 'date', h: 1, label: '기준일', v: TD },
                        { id: 'c', t: 'chk', label: '당일을 1일로 세기 (기념일 계산)' }
                    ],
                    run(v) {
                        if (!v.t || !v.b) return {};

                        const T = P(v.t);
                        const d = (T - P(v.b)) / DAY;
                        let big = d > 0 ? 'D-' + d : d === 0 ? 'D-Day' : 'D+' + -d;

                        if (v.c && d <= 0) big = (1 - d) + '일째';

                        const s = [
                            ['D-Day', big],
                            ['목표일 요일', dow(T)],
                            ['차이', fmt(Math.abs(d)) + '일' + (d > 0 ? ' 남음' : d < 0 ? ' 지남' : '')]
                        ];

                        if (v.c) [100, 200, 300, 500, 1000].forEach(n => s.push([n + '일째 날', fd(T + (n - 1) * DAY)]));
                        return { stats: s };
                    }
                },
                {
                    id: 'random-number',
                    name: '랜덤 숫자',
                    cat: '랜덤',
                    icon: ic('<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="12" cy="12" r="1"/>'),
                    keys: 'random number lottery dice 랜덤 난수 추첨 로또',
                    desc: '범위를 정해 무작위 숫자를 뽑아요.',
                    btn: '다시 뽑기',
                    fields: [
                        { id: 'lo', h: 1, label: '최솟값', v: 1 },
                        { id: 'hi', h: 1, label: '최댓값', v: 100 },
                        { id: 'n', h: 1, label: '개수', v: 1 },
                        { id: 'd', t: 'chk', h: 1, label: '중복 허용', v: 1 }
                    ],
                    run(v) {
                        if ([v.lo, v.hi, v.n].some(isNaN)) return {};
                        if (![v.lo, v.hi, v.n].every(Number.isInteger)) return { err: '정수를 입력해 주세요.' };
                        if (v.lo > v.hi) return { err: '최솟값이 최댓값보다 클 수 없어요.' };

                        const R = v.hi - v.lo + 1;
                        if (R > 4294967295) return { err: '범위가 너무 커요.' };
                        if (v.n < 1 || v.n > 1000) return { err: '개수는 1~1000 사이로 입력해 주세요.' };
                        if (!v.d && v.n > R) return { err: '중복 없이 뽑으려면 범위가 개수보다 커야 해요.' };

                        const o = [];
                        const seen = new Set();

                        while (o.length < v.n) {
                            const x = v.lo + randInt(R);
                            if (!v.d) {
                                if (seen.has(x)) continue;
                                seen.add(x);
                            }
                            o.push(x);
                        }

                        return { out: o.join(', '), n: 3 };
                    }
                },
                {
                    id: 'random-string',
                    name: '랜덤 문자열',
                    cat: '랜덤',
                    icon: ic('<path d="M12 4v16"/><path d="M5.2 8l13.6 8"/><path d="M18.8 8L5.2 16"/>'),
                    keys: 'random string password generator 비밀번호 임의 문자열',
                    desc: '비밀번호로 쓸 수 있는 무작위 문자열을 만들어요.',
                    btn: '새로 만들기',
                    fields: [
                        { id: 'n', t: 'range', label: '길이:', min: 8, max: 64, v: 16 },
                        { id: 'u', t: 'chk', h: 1, label: '대문자', v: 1 },
                        { id: 'l', t: 'chk', h: 1, label: '소문자', v: 1 },
                        { id: 'd', t: 'chk', h: 1, label: '숫자', v: 1 },
                        { id: 's', t: 'chk', h: 1, label: '기호', v: 1 }
                    ],
                    run(v) {
                        const a = ['u', 'l', 'd', 's'].filter(k => v[k]).map(k => SETS[k]);
                        if (!a.length) return { err: '문자 종류를 하나 이상 선택해 주세요.' };

                        const all = a.join('');
                        const c = a.map(s => s[randInt(s.length)]);
                        while (c.length < v.n) c.push(all[randInt(all.length)]);

                        for (let i = c.length - 1; i > 0; i--) {
                            const j = randInt(i + 1);
                            [c[i], c[j]] = [c[j], c[i]];
                        }

                        return { out: c.join(''), n: 2 };
                    }
                },
                {
                    id: 'color-convert',
                    name: '색상 변환',
                    cat: '디자인',
                    icon: ic('<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.5-1.2-.3-.4-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.4-4-7.4-9-7.4z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15.5" cy="7.5" r="1"/>'),
                    keys: 'color hex rgb hsl converter 색상 컬러',
                    desc: 'HEX, RGB, HSL 색상 코드를 서로 바꿔 줘요.',
                    render: colorTool
                },
                {
                    id: 'px-rem',
                    name: 'px / rem 변환',
                    cat: '디자인',
                    icon: ic('<path d="M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6"/>'),
                    keys: 'px rem css font size 픽셀 렘 글자 크기',
                    desc: 'CSS의 px과 rem 값을 서로 바꿔요.',
                    fields: [
                        { id: 'm', t: 'sel', label: '방향', o: ['px → rem', 'rem → px'] },
                        { id: 'x', h: 1, label: '값', v: 24 },
                        { id: 'b', h: 1, label: '기준 글자 크기 (px)', v: 16 }
                    ],
                    run(v) {
                        if (isNaN(v.x) || !(v.b > 0)) return {};

                        return {
                            list: [['결과', v.m === 0 ? fmt(v.x / v.b) + 'rem' : fmt(v.x * v.b) + 'px']],
                            stats: [8, 12, 14, 16, 18, 20, 24, 32, 48].map(p => [p + 'px', fmt(p / v.b) + 'rem'])
                        };
                    }
                },
                {
                    id: 'uuid',
                    name: 'UUID 생성',
                    cat: '개발',
                    icon: ic('<path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/>'),
                    keys: 'uuid guid generator v4 고유 식별자',
                    desc: '무작위 UUID(v4)를 원하는 만큼 만들어요.',
                    btn: '새로 만들기',
                    fields: [
                        { id: 'n', h: 1, label: '개수', v: 1 },
                        { id: 'up', t: 'chk', h: 1, label: '대문자' },
                        { id: 'nh', t: 'chk', h: 1, label: '하이픈 제거' }
                    ],
                    run(v) {
                        if (!(Number.isInteger(v.n) && v.n >= 1 && v.n <= 100)) return { err: '개수는 1~100 사이 정수로 입력해 주세요.' };

                        let o = Array.from({ length: v.n }, uid);
                        if (v.nh) o = o.map(x => x.replace(/-/g, ''));
                        if (v.up) o = o.map(x => x.toUpperCase());

                        return { out: o.join('\n'), n: Math.min(o.length + 1, 10) };
                    }
                }
            ];

            /* ---- 화면 ---- */
            const CATS = ['전체', '즐겨찾기', ...new Set(TOOLS.map(t => t.cat))];
            let favs = new Set();

            try {
                favs = new Set(JSON.parse(ls('toolbox:favs') || '[]'));
            } catch (e) {}

            const S = { q: '', cat: '전체', cur: null };
            const STAR = on => `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8-4.3-4.1 5.9-.9z" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`;

            const chips = () => {
                $('#chips').innerHTML = CATS.map(c => `<button class="chip" type="button" data-cat="${c}" aria-pressed="${S.cat === c}">${c}</button>`).join('');
            };

            function grid() {
                const q = S.q.trim().toLowerCase();
                const L = TOOLS.filter(t =>
                    (S.cat !== '즐겨찾기' || favs.has(t.id))
                    && (['전체', '즐겨찾기'].includes(S.cat) || t.cat === S.cat)
                    && (!q || (t.name + ' ' + t.desc + ' ' + t.cat + ' ' + t.keys).toLowerCase().includes(q))
                );

                $('#count').textContent = (q || S.cat !== '전체')
                    ? `${L.length}개의 도구`
                    : `도구 ${TOOLS.length}개 사용 가능`;

                $('#grid').innerHTML = L.length
                    ? L.map(t => {
                        const on = favs.has(t.id);

                        return `<article class="card"><button class="open" type="button" data-id="${t.id}"><div class="icon">${t.icon}</div><div class="nr"><span class="name">${t.name}</span><span class="tag">${t.cat}</span></div><p class="desc">${t.desc}</p><span class="go">도구 열기 ${ARROW}</span></button><button class="star" type="button" data-fav="${t.id}" aria-pressed="${on}" aria-label="${t.name} ${on ? '즐겨찾기에서 빼기' : '즐겨찾기에 추가'}">${STAR(on)}</button></article>`;
                    }).join('')
                    : `<p class="empty" style="grid-column:1/-1">${S.cat === '즐겨찾기' && !q ? '즐겨찾기한 도구가 없어요. 카드 오른쪽 위의 별을 눌러 추가해 보세요.' : '찾는 도구가 없어요. 다른 단어로 검색해 보세요.'}</p>`;
            }

            function show() {
                const t = TOOLS.find(x => x.id === S.cur);

                if (!t) {
                    S.cur = null;
                    $('#tool').hidden = true;
                    $('#home').hidden = false;
                    document.title = '미니 도구 상자';
                    grid();
                    return;
                }

                $('#home').hidden = true;
                $('#tool').hidden = false;
                $('#tt').textContent = t.name;
                $('#td').textContent = t.desc;

                const b = $('#tb');
                b.innerHTML = '';
                t.render ? t.render(b) : form(b, t);
                document.title = t.name + ' · 미니 도구 상자';
                scrollTo(0, 0);
            }

            function go(id) {
                S.cur = id;
                try {
                    location.hash = id ? '/' + id : '';
                } catch (e) {}
                show();
            }

            const hid = () => {
                const m = (location.hash || '').match(/^#\/([\w-]+)$/);
                return m ? m[1] : null;
            };

            const home = () => {
                S.q = '';
                S.cat = '전체';
                $('#q').value = '';
                chips();
                go(null);
            };

            $('#q').addEventListener('input', e => {
                S.q = e.target.value;
                S.cur ? go(null) : grid();
            });

            document.addEventListener('keydown', e => {
                if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                    e.preventDefault();
                    $('#q').focus();
                }
            });

            $('#brand').addEventListener('click', home);
            $('#navTools').addEventListener('click', home);

            $('#chips').addEventListener('click', e => {
                const b = e.target.closest('.chip');
                if (!b) return;
                S.cat = b.dataset.cat;
                chips();
                grid();
            });

            $('#grid').addEventListener('click', e => {
                const s = e.target.closest('.star');

                if (s) {
                    const id = s.dataset.fav;
                    favs.has(id) ? favs.delete(id) : favs.add(id);
                    ls('toolbox:favs', JSON.stringify([...favs]));
                    grid();
                    return;
                }

                const o = e.target.closest('.open');
                if (o) go(o.dataset.id);
            });

            $('#back').addEventListener('click', () => go(null));

            addEventListener('hashchange', () => {
                const id = hid();
                if (id === S.cur) return;
                S.cur = id;
                show();
            });

            $('#theme').addEventListener('click', () => {
                const r = document.documentElement;
                const n = r.dataset.theme === 'dark' ? 'light' : 'dark';
                r.dataset.theme = n;
                ls('toolbox:theme', n);
            });

            chips();
            S.cur = hid();
            show();
        })();
    </script>
</body>
</html>
